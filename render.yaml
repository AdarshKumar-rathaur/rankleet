services:
  - type: web
    name: rankleet
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false

cronJobs:
  - name: rankleet-warmup
    schedule: "*/4 * * * *"
    command: bash -lc 'curl -fsS "$CRON_PING_URL" || true'
    envVars:
      - key: CRON_PING_URL
        value: https://rankleet.onrender.com/health